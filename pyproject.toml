[project]
name = "multi-agent-software-team"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cristian Martín", email = "cmf18.software@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.33.0",
    "python-dotenv>=1.2.4",
    "rich>=13.9.0",
]

[project.scripts]
multi-agent-software-team = "multi_agent_software_team:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a running Docker daemon"
]