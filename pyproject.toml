[project]
name = "cmf-dev-studio"
version = "0.2.0"
description = "Local-first AI-assisted development environment with multi-agent orchestration and approved local testing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cristian Martín Ferrer", email = "cmf18.software@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.33.0",
    "python-dotenv>=1.2.4",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
cmf-dev-studio = "cmf_dev_studio:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
markers = [
    "integration: optional tests requiring native build tools"
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
